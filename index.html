<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFANTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08070d;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 60% 45% at 50% -10%, rgba(124, 58, 237, 0.16) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 85% 100%, rgba(124, 58, 237, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 45% 35% at 10% 60%, rgba(88, 28, 200, 0.06) 0%, transparent 70%),
                var(--bg);
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 56px 24px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            background: linear-gradient(var(--bg), var(--bg)) padding-box,
                        linear-gradient(135deg, #8b5cf6, #c4b5fd) border-box;
            box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.15), 0 8px 30px rgba(124, 58, 237, 0.25);
            margin-bottom: 22px;
        }

        .name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 20%, #c4b5fd 60%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 40px;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            animation: in 0.6s ease forwards;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
            transform: translateX(-150%);
            transition: transform 0.6s ease;
            pointer-events: none;
        }
        .card:hover::before {
            transform: translateX(150%);
        }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
        .card:nth-child(9) { animation-delay: 0.45s; }

        @keyframes in {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            background: rgba(139, 92, 246, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
        }

        .icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .label {
            font-size: 15px;
            font-weight: 600;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 28px;
            padding: 13px 26px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 100px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }
        .copy-btn:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.12));
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.25);
        }
        .copy-btn svg {
            width: 16px;
            height: 16px;
        }

        .footer {
            margin-top: 36px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.22);
        }

        @media (max-width: 380px) {
            .page { padding: 40px 18px; }
            .avatar { width: 96px; height: 96px; }
            .name { font-size: 26px; }
        }
    </style>
</head>
